<!doctype html>
<!-- 페이지 공방 앱 — 설치형 웹 앱(PWA) 껍데기. 화면 그리기는 app.js · 페이지 조립은 engine.js -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>페이지 공방</title>
<meta name="description" content="부품을 쌓고 끌어 놓아 세련된 웹 페이지를 만드는 앱">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-m="edit">
  <header class="top">
    <span class="logo"><i aria-hidden="true"></i><span class="wide">페이지 공방</span></span>
    <input class="pname" id="pname" aria-label="페이지 이름" value="">
    <button class="btn sm" id="b-pages" type="button">페이지 목록</button>
    <button class="btn sm pri" id="b-export" type="button">내보내기</button>
  </header>
  <div class="main">
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="blocks" aria-selected="true">블록</button>
        <button role="tab" data-tab="style" aria-selected="false">꾸미기</button>
        <button role="tab" data-tab="page" aria-selected="false">페이지</button>
      </div>
      <div class="pane" id="pane"><p class="hint">불러오는 중…</p></div>
    </aside>
    <section class="view">
      <div class="vbar"><span id="vinfo">미리보기</span><span class="sp"></span>
        <button class="chip" data-dev="phone" aria-pressed="true" type="button">폰</button>
        <button class="chip" data-dev="pc" aria-pressed="false" type="button">PC</button></div>
      <div class="stage"><iframe class="frame phone" id="frame" title="만드는 페이지 미리보기"></iframe></div>
    </section>
  </div>
  <nav class="mnav" aria-label="화면 바꾸기">
    <button type="button" data-m="edit" aria-pressed="true">편집</button>
    <button type="button" data-m="view" aria-pressed="false">미리보기</button>
  </nav>
</div>
<dialog id="dlg"></dialog>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="fields.js"></script>
<script src="app.js"></script>
</body>
</html>
